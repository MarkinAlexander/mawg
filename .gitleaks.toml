title = "mawg secret scan"

# Стандартный набор правил gitleaks (ключи, токены, private keys и т.д.)
# плюс собственное правило публичных IPv4 ниже.
[extend]
useDefault = true

# Утечки этого проекта - публичные IP серверов провайдера и живые креды в
# тестовых фикстурах. Ловим любой валидный IPv4; зарезервированное,
# документационное и функциональные адреса приложения - в allowlist.
# Basline обновлять осознанно: новый публичный IP в коде - либо легитимный
# (добавить сюда с комментарием, почему), либо утечка.
[[rules]]
id = "public-ipv4"
description = "Public IPv4 address"
regex = '''\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'''

[rules.allowlist]
regexTarget = "match"
regexes = [
  # --- зарезервированное ---
  '''^0\.0\.0\.0$''',
  '''^255\.255\.255\.255$''',
  '''^127\.\d{1,3}\.\d{1,3}\.\d{1,3}$''',
  '''^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$''',
  '''^192\.168\.\d{1,3}\.\d{1,3}$''',
  '''^172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}$''',
  '''^169\.254\.\d{1,3}\.\d{1,3}$''',
  # CGNAT 100.64.0.0/10 и края диапазона (тесты границ)
  '''^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}$''',
  '''^100\.63\.255\.255$''',
  '''^100\.128\.0\.1$''',
  # multicast
  '''^(22[4-9]|2[3-9]\d)\.\d{1,3}\.\d{1,3}\.\d{1,3}$''',
  # --- RFC 5737 (документационные): легальны в фикстурах тестов ---
  '''^192\.0\.2\.\d{1,3}$''',
  '''^198\.51\.100\.\d{1,3}$''',
  '''^203\.0\.113\.\d{1,3}$''',
  # --- публичные DNS-резолверы ---
  '''^8\.8\.8\.8$''', '''^8\.8\.4\.4$''', '''^1\.1\.1\.1$''', '''^1\.0\.0\.1$''',
  '''^9\.9\.9\.9$''', '''^149\.112\.112\.112$''',
  '''^77\.88\.8\.8$''', '''^77\.88\.8\.1$''',
  '''^94\.140\.1[45]\.\d{1,2}$''',
  '''^208\.67\.22[02]\.22[02]$''',
  # --- версии-строки, совпадающие с формой IPv4 ---
  '''^0\.7\.\d{1,2}\.\d{1,2}$''',  # старые версии mawg (selfupdate, 4-частные)
  '''^5\.0\.3\.0$''',   # версия AmneziaVPN-клиента (amnezia.go/gateway.go)
  # --- WARP-датацентры (internal/warp/endpoints.go, функциональные префиксы) ---
  '''^8\.39\.(125|204|214)\.\d{1,3}$''',
  '''^8\.47\.69\.\d{1,3}$''',
  '''^8\.6\.112\.10$''',
  '''^162\.159\.19[2-5]\.\d{1,3}$''',
  '''^188\.114\.9[6-9]\.\d{1,3}$''',
  # --- серверы DNS-проб (internal/dnsprobe/dnsprobe.go) ---
  '''^116\.202\.120\.16[56]$''',
  '''^204\.8\.99\.14[46]$''',
  '''^95\.216\.163\.36$''',
  # --- CDN/соцсетевые диапазоны списков magitrickle (presets.go, публичные) ---
  '''^5\.28\.192\.0$''', '''^31\.13\.24\.0$''', '''^91\.105\.192\.0$''',
  '''^91\.108\.0\.0$''', '''^95\.161\.(64|76|128)\.\d{1,3}$''',
  '''^108\.177\.8\.0$''', '''^149\.154\.160\.[01]$''', '''^157\.240\.0\.0$''',
  '''^173\.252\.64\.0$''', '''^185\.60\.216\.0$''', '''^185\.76\.(128|148)\.0$''',
  '''^185\.81\.128\.0$''', '''^194\.221\.250\.0$''',
  # --- синтетика тестов (заведомо выдуманные значения) ---
  '''^1\.1\.1\.[23]$''', '''^1\.2\.3\.\d{1,3}$''', '''^2\.2\.2\.[02]$''',
  '''^3\.3\.3\.3$''', '''^5\.6\.7\.8$''', '''^6\.6\.6\.6$''',
  '''^7\.7\.7\.7$''', '''^7\.8\.8\.8$''',
]
# файлы, чьё назначение - публичные IP-данные (WARP-пул, подсети CDN,
# собранный UI-бандл): правило IPv4 их не проверяет, остальные правила
# gitleaks (ключи/токены) продолжают работать.
paths = [
  '''^internal/warp/sites_data\.go$''',
  '''^internal/warp/endpoints\.go$''',
  '''^internal/magitrickle/data/allow-domains/''',
  '''^internal/web/ui/''',
  '''^ui-src/public/''',
]

# Синтетические ключи тестовых фикстур (выдуманные base64/WG-ключи и
# плейсхолдеры): стандартное правило generic-api-key ругается на них по
# энтропии. Точные значения - реальный ключ здесь не пройдёт.
[allowlist]
description = "синтетические ключи тестовых фикстур"
regexes = [
  '''^SMAp//W\+/qjES6qfuxaVCM8jQlQtHhgDgHZrhDCfe00=$''',
  '''^V0FSUC1TQ09VVC1URVNULUtFWS0wMDEtMjM0LTU2Nzg=$''',
  '''^YMG9kWQIDtUsXbYMG9kWQIDtUsXbYMG9kWQ(=|IDtUsXbYMG9kWQIDtUsXbYMG9kWQ=)$''',
  '''^bWC4hghUjJ6lD7F2QZ1rO0WEP7AezONJmXVssOFkR8E=$''',
  '''^c3ludGhldGljLWhwLWtleQ==$''',
  '''^gEyQZ7ioEGZMg6xF8Wwf0A9mifQodrcdrjDEzIwjNmw=$''',
  '''^kLKh8p7664kHCd8rKtcfHWgmaWqzv1mTUAQxtCf/GVU=$''',
  '''^uJd2xK5t0mFvqWz\+YbN8cLrA3eHh7oPqQ1wZsX4dC6k=$''',
]
